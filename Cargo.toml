[package]
name = "folder-intelligence"
version = "0.1.0"
edition = "2021"
description = "Filesystem evidence engine - observe, don't interpret"
license = "MIT OR Apache-2.0"
repository = "https://github.com/folder-intelligence/folder-intelligence"
keywords = ["filesystem", "evidence", "scan", "metadata", "jsonl"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.10"
bstr = "1.10"
regex = "1.10"
pico-args = "0.5"

[[bin]]
name = "fi"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
